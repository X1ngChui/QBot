# QBot with its database and NapCat. Run from this directory:
#
#   cp config/config.toml.example config/config.toml      # optional overrides
#   printf '%s' 'a-strong-password' > secrets/database_password
#   printf '%s' 'sk-...'            > secrets/text_api_key
#   printf '%s' 'sk-...'            > secrets/embedding_api_key
#   printf '%s' 'a-long-random-token' > secrets/onebot_access_token   # NapCat presents this
#   cp config/personas/default.toml.example config/personas/default.toml
#   deploy/fetch_asr_model.sh                              # voice model, once (or media.transcribe_voice = false)
#   docker compose run --rm qbot check-config              # validate before starting
#   docker compose up -d
#
# NapCat: set NAPCAT_ACCOUNT in .env, log in once by QR code in the WebUI (an SSH tunnel to
# 127.0.0.1:6099), and in its OneBot settings add a reverse WebSocket to
# ws://qbot:6199/onebot/v11/ws with the token above and turn on enableLocalFile2Url. The saved
# session logs in by itself after that.
#
# Layout (host -> container):
#   ./config  -> /etc/qbot       read-only   non-secret settings (config.toml, conf.d/, personas, locales)
#   ./data/qbot -> /var/lib/qbot read-write  persistent state (models, backups)
#   ./secrets -> /run/secrets    read-only   one file per secret, named in lower case
#   ./data/postgres              the database's own volume
#   ./data/napcat                NapCat's settings and QQ session (QBot never reads it)

name: qbot

services:
  postgres:
    image: ${REGISTRY:-docker.io}/pgvector/pgvector:0.8.5-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qbot
      POSTGRES_USER: qbot
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbot -d qbot"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  qbot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${QBOT_IMAGE:-qbot:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["run"]
    environment:
      # Non-secret, deployment-specific overrides use QBOT__SECTION__KEY. Anything that is the
      # same everywhere belongs in ./config/config.toml instead. Credentials never go here.
      QBOT__DATABASE__HOST: postgres
    volumes:
      - ./config:/etc/qbot:ro
      - ./data/qbot:/var/lib/qbot
    secrets:
      - database_password
      - text_api_key
      - embedding_api_key
      - onebot_access_token
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  napcat:
    image: ${REGISTRY:-docker.io}/mlikiowa/napcat-docker:v4.18.13
    restart: unless-stopped
    environment:
      # Quick login with the saved session, so a restart needs no QR scan.
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ
    ports:
      - "127.0.0.1:6099:6099"   # WebUI, loopback only
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

secrets:
  database_password:
    file: ./secrets/database_password
  text_api_key:
    file: ./secrets/text_api_key
  embedding_api_key:
    file: ./secrets/embedding_api_key
  onebot_access_token:
    file: ./secrets/onebot_access_token
