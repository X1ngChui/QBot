# Image-baked defaults: the base layer of the configuration, compiled into the binary and
# copied to /usr/share/qbot/defaults.toml in the image as a reference.
#
# Every key the application reads appears here, so this file is the complete schema. Do not
# edit it in a deployment. Override a key in /etc/qbot/config.toml, in /etc/qbot/conf.d/*.toml,
# or with an environment variable (QBOT__SECTION__KEY). Credentials never appear in any of
# these: a `*_secret` key holds only the NAME of a secret, which is read from the environment
# or a mounted secret file.
#
# Durations carry their unit in the key name (`_secs`, `_ms`).

[paths]
# Relative paths are resolved under the data directory (QBOT_DATA_DIR, default /var/lib/qbot).
models_dir = "models"
backups_dir = "backups"
# Relative paths are resolved under the config directory (QBOT_CONFIG_DIR, default /etc/qbot).
personas_dir = "personas"
locales_dir = "locales"

[bot]
# The bot's own QQ account. There is no sensible default: it must be set in config.toml, and
# `check-config` and `run` refuse to start while it is 0.
account = 0
# QQ accounts of the bot's owners. Owners may use owner-only commands and cannot be blocked.
owners = []
# Names that address the bot as a whole word, in addition to an @ and quoting one of its lines.
nicknames = []
# IANA time zone for times shown to members and to the model.
timezone = "UTC"
# Wording of member-facing text: a built-in tag (en, zh-CN) or a Fluent file <locales_dir>/<tag>.ftl.
locale = "en"

[gateway]
# The address NapCat's reverse WebSocket connects to.
listen = "0.0.0.0:6199"
path = "/onebot/v11/ws"
# NAME of the secret holding the access token NapCat presents. Empty disables authentication,
# which is only sensible on a private network.
access_token_secret = "ONEBOT_ACCESS_TOKEN"
# How long the platform may take to accept a send.
action_timeout_secs = 10
# How long after acceptance the bot's own message may take to be reported back.
echo_timeout_secs = 15
# The platform's cap on one message, in characters. Command replies are split to fit.
max_message_chars = 2000

[commands]
# Rows /members lists and the most rows /top shows.
members_max_rows = 60
top_max_rows = 20
# Runs /runs lists.
runs_max_rows = 10
# Most notes about one account in a group. Notes reach the model in member lookups, so this
# bounds what one member's notes can add to a reply's context.
notes_per_account = 20

[database]
# The compose service name; change for an external server.
host = "postgres"
port = 5432
name = "qbot"
user = "qbot"
# disable | prefer | require | verify-ca | verify-full
ssl_mode = "prefer"
password_secret = "DATABASE_PASSWORD"
max_connections = 16
connect_timeout_secs = 10

[runtime]
# Recent warnings and errors kept in memory for /logs (0 keeps none). They also go to the
# normal log output.
log_buffer_lines = 200
# Active plus waiting runs, timers included. Overload and expiry end silently.
reply_capacity = 32
# Runs allowed to call the model at the same time.
reply_concurrency = 3
# One deadline per run, from admission; queue time counts against it.
reply_deadline_secs = 180

[agent]
# Model turns per run: a guard against a model that never stops calling tools.
max_turns = 20
# Messages one run may send: a rule against flooding the group.
max_sends_per_run = 4
# Per model call.
max_output_tokens = 4096
# off | low | medium | high
reasoning = "low"

[history]
# What a reply is shown of the chat, in batches (the unit history is appended and dropped in;
# memory slices are whole batches too). Line counts, not a token budget.
# Lines per batch.
batch_lines = 30
# The newest batches, shown verbatim, counting the one being filled.
raw_batches = 4
# The batches before those, shown as the summaries of the episodes that end there (a batch no
# episode covers yet stays verbatim). Older chat is left out of the prompt and reached through
# the history and memory tools. 0 shows no summaries.
summary_batches = 9

[providers.text]
# deepseek | openai_responses
kind = "deepseek"
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "TEXT_API_KEY"
# stateless | server_state (the deepseek kind is always stateless)
state = "stateless"
request_timeout_secs = 120
connect_timeout_secs = 10
retries = 2
retry_base_ms = 500
retry_jitter = true

[providers.vision]
# Describes pictures. Off by default: pictures then stay as bare `[image]` markers.
enabled = false
# deepseek (images are uploaded through its Files API) | openai_responses (sent inline)
kind = "deepseek"
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "VISION_API_KEY"
max_output_tokens = 300
request_timeout_secs = 60
connect_timeout_secs = 10
retries = 2
retry_base_ms = 500
retry_jitter = true

[providers.embedding]
endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "text-embedding-v4"
# Vector width. Changing the model or the width hides old vectors until they are rebuilt.
dims = 2048
# Inputs per request the endpoint accepts.
max_batch = 10
api_key_secret = "EMBEDDING_API_KEY"
request_timeout_secs = 30
connect_timeout_secs = 10
retries = 2
retry_base_ms = 500
retry_jitter = true


[providers.search]
# Web search and page reading through Tavily, for the web_search and read_url tools. Off by
# default: the tools are then not offered.
enabled = false
endpoint = "https://api.tavily.com"
api_key_secret = "SEARCH_API_KEY"
# Results per search (1 to 20); each costs reading time and context, not credits.
max_results = 5
# basic | advanced (advanced costs two credits per search)
depth = "basic"
# Page reading for read_url: basic | advanced (advanced handles harder pages, two credits).
extract_depth = "basic"
# Passages of a page returned when read_url is given a question (1 to 5).
chunks_per_source = 3
# HTTP(S) proxy for the search client only (where the provider is not reachable directly);
# empty connects directly. Model traffic never uses it.
proxy = ""
request_timeout_secs = 20
connect_timeout_secs = 10
retries = 2
retry_base_ms = 500
retry_jitter = true
[media]
# Pictures are described and voice clips transcribed when a message arrives; these bound that.
# Per group, per minute.
images_per_minute = 6
clips_per_minute = 20
max_image_mb = 8
max_audio_secs = 300
# Fetches, model calls and recognitions at once, and messages with media in flight or waiting.
# Beyond the capacity, media stays a bare marker.
concurrency = 4
capacity = 32
# How long a reply waits for the triggering message's media before it goes ahead without.
wait_secs = 25
http_timeout_secs = 20
# One platform action. A file the platform can no longer serve hangs rather than failing.
protocol_timeout_secs = 10
# How long a picture that could not be read, or was declined, is not tried again.
unreadable_hold_secs = 600
# The language picture descriptions are written in.
description_language = "English"
# Messages of a forwarded record shown in its line; the rest are only counted. A record can
# hold hundreds of messages, and every prompt that shows the line would carry them all.
forward_max_lines = 30

[asr]
# Voice transcription in the process (SenseVoice on CPU). With it off, clips stay `[voice]`.
enabled = true
# Under paths.models_dir; holds model.int8.onnx and tokens.txt (deploy/fetch_asr_model.sh).
model_dir = "asr/sense-voice"
# auto | zh | en | ja | ko | yue
language = "auto"
threads = 2
# Recognitions at once.
workers = 1

[maintenance]
# When the nightly pipeline (memory extraction, decay, backup, cleanup) and the daily report to
# the owners run: five-field cron expressions evaluated in bot.timezone. A run missed while the
# bot was down happens once when it comes back.
nightly_cron = "30 2 * * *"
report_cron = "0 0 * * *"
# Verified pg_dump backups into paths.backups_dir. Needs the PostgreSQL client tools.
backups_enabled = true
backup_keep = 14
backup_timeout_secs = 900
# The directory holding pg_dump and pg_restore; empty finds them on PATH.
postgres_bin_dir = ""
# A name candidate nobody vouched for and no evidence supported for this long is dropped.
alias_unused_days = 30
# Picture descriptions older than this are forgotten and redone when next needed; 0 keeps them.
description_ttl_days = 15
# Finished timers older than this are deleted.
timers_keep_days = 30
# Finished runs (the full transcripts) older than this are deleted; 0 keeps them forever.
runs_keep_days = 90
# Ask NapCat to clean its own file cache (its clean_cache action: downloaded pictures, voice,
# videos, files and its logs) in the nightly cleanup. NapCat has no age-based retention, so its
# cache otherwise grows without bound.
napcat_clean_cache = true

[tasks]
# Group tasks. These bound a model scheduling itself in a loop.
min_delay_secs = 300
max_pending_per_group = 50
max_chain_depth = 24

[scheduler]
job_lease_secs = 900
max_job_attempts = 5
# Delay before retry n; the last entry repeats.
job_backoff_secs = [60, 300, 1800, 3600]
max_concurrent_jobs = 2

[tools.search_history]
default_limit = 8
max_limit = 50

[tools.read_url]
# Most characters of a page shown to the model; a longer page is cut and says so. A web page is
# the one tool input with no size of its own.
max_chars = 8000

[memory]
# Language the episode summaries are written in.
language = "English"
# Batches per episode slice: the one memory-slicing setting.
slice_batches = 3
# Batches of neighboring chat shown to the extractor as context only.
previous_context_batches = 1
# Capped by the retained window and by what has been produced when the slice is extracted.
next_context_batches = 1

[memory.extraction]
# Room for the model's reasoning as well as the answer: a slice of real chat can take several
# thousand reasoning tokens, and an answer cut off at this limit is lost.
max_output_tokens = 8192
# Times a rejected answer is sent back for correction.
max_attempts = 3

[memory.recall]
limit = 5
# Cosine distance beyond which an episode is not relevant enough to return.
max_distance = 0.45

[memory.facts]
# How quickly a fact nobody confirms again is forgotten, by its predicate's decay class: its
# confidence halves every half-life since it was last confirmed.
half_life_days = { stable = 90, default = 30, fast = 14 }
# A fact whose confidence falls below this is expired by the nightly decay.
forget_below = 0.05

[identity]
# A name resolves from this confidence up.
confirm_at = 0.75
invitation_ttl_secs = 600
