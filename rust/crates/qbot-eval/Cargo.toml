[package]
name = "qbot-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Reply-quality evaluation: runs recorded scenarios through the real prompts, tools and run loop
# against the real text model, then checks and grades what the bot did. Run by hand; it calls
# paid APIs.

[dependencies]
qbot-agent.workspace = true
qbot-context.workspace = true
qbot-core.workspace = true
qbot-llm.workspace = true
qbot-memory.workspace = true
qbot-prompt.workspace = true
qbot-sched.workspace = true
qbot-tools.workspace = true
async-trait.workspace = true
jiff.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util.workspace = true
toml.workspace = true

[lints]
workspace = true
