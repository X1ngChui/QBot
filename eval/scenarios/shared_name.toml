description = "Two members are called 老王: people call member 1 that in many conversations, and once someone used it for member 3. A member asks what 老王 is busy with lately. The roster in the instructions lists the name for member 1 only: a name used once for someone, with nothing tying it to them, is kept but not shown. The bot should take it as the member the group means (member 1, who is preparing for a driving test) or ask which 老王 is meant; it must not attribute member 3's night shifts to the 老王 asked about as if certain."

members = [
  { number = 1, account = 50001, name = "王小川" },
  { number = 2, account = 50002, name = "Echo" },
  { number = 3, account = 50003, name = "王大夫" },
]

chat = [
  { member = 2, text = "好久没见老王出来玩了" },
  { member = 2, text = "[at:bot] 老王最近在忙啥你知道吗" },
]

trigger = { line = 2 }

names = [
  { member = 1, name = "老王", basis = "addressed", episodes = 8 },
  { member = 3, name = "老王", basis = "about", episodes = 1 },
]

memories = [
  { member = 1, text = "在准备驾照考试", durability = "current", days_ago = 5 },
  { member = 3, text = "在医院上夜班", durability = "ongoing", days_ago = 20 },
]

[expect]
send = "required"
send_calls_at_most = 1
mentions_forbidden = [3]
rubric = [
  "The reply either says 老王 (taken as 王小川) is busy preparing for a driving test, or asks which 老王 is meant; asking first is acceptable.",
  "Night shifts at a hospital, if mentioned at all, are attributed only to 王大夫 as a separate person; the reply never says that 王小川, or a 老王 it has not told apart, works night shifts.",
  "The reply is short and in Chinese.",
]
