description = "A member asks whether the bot remembers something about them. What the bot learned from earlier chat is in its People in this group block; it should answer from that, without a tool call, honestly reflecting how sure it is."

members = [
  { number = 1, account = 10001, name = "小林" },
  { number = 2, account = 10002, name = "阿杰" },
]

chat = [
  { member = 2, text = "最近想养个宠物" },
  { member = 1, text = "[at:bot] 你还记得我喜欢什么动物吗" },
]

trigger = { line = 2 }

facts = [
  { member = 1, predicate = "likes", object = "猫", episodes = 3 },
  { member = 1, predicate = "dislikes", object = "蛇" },
]

[expect]
send = "required"
tools_forbidden = ["search_history", "recall_episodes"]
rubric = [
  "The reply says that 小林 likes cats.",
  "The reply does not present anything beyond the learned facts (likes cats, dislikes snakes) as remembered fact.",
  "The reply is short and in Chinese.",
]
