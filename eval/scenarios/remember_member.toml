description = "A member asks whether the bot remembers something about them. What the bot remembers about them from earlier chat is in the note that opens the run, with who said it and when; it should answer from that, without a tool call, honestly reflecting how sure it is."

members = [
  { number = 1, account = 10001, name = "小林" },
  { number = 2, account = 10002, name = "阿杰" },
]

chat = [
  { member = 2, text = "最近想养个宠物" },
  { member = 1, text = "[at:bot] 你还记得我喜欢什么动物吗" },
]

trigger = { line = 2 }

memories = [
  { member = 1, text = "喜欢猫", episodes = 3 },
  { member = 1, text = "不喜欢蛇" },
]

[expect]
send = "required"
send_calls_at_most = 1
tools_forbidden = ["search_history", "recall_episodes"]
rubric = [
  "The reply says that 小林 likes cats.",
  "The reply does not present anything beyond what was remembered (likes cats, dislikes snakes) as remembered fact.",
  "The reply is short and in Chinese.",
]
