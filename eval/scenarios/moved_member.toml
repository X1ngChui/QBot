description = "A member asked about where someone lives. The bot remembered, from three conversations long ago, that they lived in Hangzhou; ten days ago they said they live in Shanghai now, which replaced the old memory. The run's opening note shows only what holds now; the replaced memory is history about_member can show. The bot should say Shanghai and not present Hangzhou as current. Looking the question up first is fine; the answer is what is judged."

members = [
  { number = 1, account = 10001, name = "小林" },
  { number = 2, account = 10002, name = "阿杰" },
]

chat = [
  { member = 2, text = "周末想约小林吃饭" },
  { member = 2, text = "[at:bot] 小林现在住哪个城市来着" },
]

trigger = { line = 2 }

memories = [
  { member = 1, text = "住在杭州", durability = "lasting", episodes = 3, days_ago = 200 },
  { member = 1, text = "搬到上海住了", durability = "lasting", days_ago = 10, replaces = 1 },
]

[expect]
send = "required"
send_calls_at_most = 1
rubric = [
  "The reply says 小林 lives in Shanghai (上海), possibly with a light hedge or a note that they lived in Hangzhou before.",
  "The reply does not say that 小林 lives in Hangzhou (杭州) now.",
  "The reply is short and in Chinese.",
]
