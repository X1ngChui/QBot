# Short model-facing wording: tool descriptions, parameter descriptions, tool results and error
# explanations, and the small texts the prompt layer and memory extraction write. Long prompts
# are the templates next to this file. `{name}` is a slot the code fills; each text's slots are
# fixed by `qbot-wording`, and a test keeps this file and the code in step. English only.

[tools.send_messages]
description = "Send your reply to the group: the only way to speak. Each item of messages is one QQ message, sent in order, all in this one call. Chat as people do in a group: one message is fine, and so are a few short ones when that reads more naturally; a longer reply, with several points or more than a few sentences, goes out as a few messages, one thought each, not as one block. Do not give every sentence or clause its own message. Every message belongs to the reply you are making: no remarks tacked on for other people, no afterthoughts added just to keep talking. A run sends at most {max} messages in all. The result comes once every message has been sent and shows each as the platform delivered it, including the outcome of [dice] or [rps]."
param_messages = "The reply's messages in order; each is its own QQ message in plain text (QQ shows no Markdown). Quote ([reply:ID]) only where it helps, normally once, on the first message. These markers, and only these, become part of a message: start it with [reply:ID] to quote message ID; [at:N] mentions member N; [face:N] is a QQ face. [dice] and [rps] (asking the platform to roll or play, never with an outcome) and [contact:N] (member N's contact card) must each be a message of their own: put any words you want with them in a separate message of the same call. Every other marker you read in the chat ([image:...], [link:...], [file:...] and the rest) describes what others sent and cannot be sent: written here it would reach the group as literal text."
param_end_turn = "Whether the run ends after these messages; defaults to true. Set false to go on, for example to react to the outcome of [dice] or [rps]."
sent = "sent [msg:{id}] {text}"
limit = "at most {max} messages can be sent per run, so only {left} more now; nothing was sent"
rejected = "the platform rejected the message: {reason}"
unconfirmed = "the message was not confirmed and may already be in the group; do not send it again"
empty = "the message is empty"
none = "give at least one message"
item = "message {n}: {problem}; nothing was sent"
failed = "message {n} failed: {problem}"
stopped = "messages {from} to {to} were not sent: sending stops at the first message that fails"
alone = "[dice], [rps] or [contact:N] must be the whole message, with nothing else in it"
chosen_result = "you cannot choose the result: send [{name}] alone and the platform rolls or plays; what it came up with comes back in this tool's result as [{name} result:...]"
reply_first = "a quote ([reply:ID]) must come first in the message"
no_member = "no member {member} has appeared in this chat"
no_message = "message {id} is not in this chat"
not_message_id = "{id} is not a message id"
needs_member = "[{name}:...] needs a member number, as in [{name}:3]"
needs_face = "[{name}:...] needs a face id, as in [{name}:14]"
needs_message = "[{name}:...] needs a message id, as in [{name}:123]"
too_large = "the number in [{name}:...] is too large"
at_all = "mentioning everyone ([at:all]) is not allowed"

[tools.stay_silent]
description = "End your turn without saying anything in the group, when nothing needs to be said."
result = "staying silent"

[tools.search_history]
description = "Search this group's chat history by words, newest matches first. Supports AND (spaces), OR, -exclusion, (grouping) and \"phrases\", and can be limited to one member."
param_query = "What to look for. Words separated by spaces must all occur; OR between parts means either; -word (or NOT word) excludes; parentheses group; \"quoted words\" are one phrase. Operators are capitals. Example: (printer OR scanner) -copier"
param_speaker = "Only messages of the member with this number."
param_limit = "How many matches to return; the tool states its own bounds when one is out of range."
no_matches = "no matches"
limit_range = "limit must be between 1 and {max}"
query_unreadable = "the query cannot be read at character {at}"
query_expected = "the query cannot be read at character {at}: expected {expected}"
query_only_excludes = "the query only excludes; it needs at least one word or phrase to look for"
expect_operand = "a word, a \"phrase\" or a (group)"
expect_after_or = "a word, a \"phrase\" or a (group) after OR"
expect_after_minus = "a word, a \"phrase\" or a (group) after '-'"
expect_after_not = "a word, a \"phrase\" or a (group) after NOT"
expect_phrase_text = "some text between the quotes"
expect_closing_quote = "a closing \""
expect_closing_paren = "a closing )"
expect_end = "the end of the query (is there a ')' without its '('?)"

[tools.recall_episodes]
description = "Recall past episodes of this group by meaning, best first: how closely each matches counts most, and older episodes count for less. Each result is a summary; use read_episode with its number to see the actual messages."
param_question = "What to remember: a question or a description of the event."
empty_question = "question must not be empty"
no_matches = "no matching episodes"
episode = "episode {id} ({start} to {end}, {count} messages): {title}: {summary}"

[tools.read_episode]
description = "Read the messages of one episode of this group, in order."
param_id = "The episode number from recall_episodes or a summary of earlier conversation."
no_such = "this group has no episode {id}"

[tools.schedule_task]
description = "Schedule a task for this group that runs once. When it comes due you wake with fresh context and decide what to do; it may run a little late. For something a member asked to recur, use schedule_repeating_task instead."
param_intent = "The goal, its conditions and who it is for, in a sentence or two that stay true later: people as member:N, dates instead of words like \"tomorrow\", no message ids. Not the message itself: when the task comes due you decide what to say."
param_run_at = "When to fire, as an RFC 3339 timestamp with a UTC offset. Give this or delay_seconds."
param_delay_seconds = "Seconds from now. Give this or run_at."
scheduled = "scheduled: {task}"

[tools.schedule_repeating_task]
description = "Schedule a task for this group that comes due again by itself on a schedule until it is cancelled. Use it only when a member explicitly asks for something recurring (\"every day\", \"each Monday\"). Each run wakes you with fresh context; never schedule a repeating task's next run yourself."
param_intent = "What each run is for, written as for schedule_task. The schedule belongs in rule, not here."
param_rule = "The schedule, in the time zone of the Now line: an interval of whole minutes, hours or days (\"90m\", \"6h\", \"1d\"; at least {min}), \"daily@HH:MM\" (every day at that time, 24-hour clock), or weekdays and a time (\"mon,thu@08:00\"; days mon tue wed thu fri sat sun)."
param_start_at = "The earliest the first run may be, as an RFC 3339 timestamp with a UTC offset. Optional: without it an interval starts one interval from now and a time of day at its next occurrence."

[tools.list_tasks]
description = "List this group's pending and running tasks, soonest first."
param_page = "Zero-based page of five tasks; defaults to 0."
none = "no scheduled tasks"
empty_page = "no tasks on this page"
more = "more tasks on page {page}"

[tools.get_task]
description = "Show one task of this group."
param_id = "The task number."

[tools.update_task]
description = "Change the intent or the time of a pending task of this group. A new time is when it next comes due; a repeating task's later runs follow its rule from there. A repeating task is changed only when a member asks. Its rule is not changed here: to repeat on another schedule, cancel it and schedule a new repeating task."
param_id = "The task number."
param_intent = "The new intent, written as for schedule_task, if it changes."
param_run_at = "New time as an RFC 3339 timestamp with a UTC offset. Give this or delay_seconds."
param_delay_seconds = "New time as seconds from now."
updated = "updated: {task}"

[tools.cancel_task]
description = "Cancel a pending task of this group, or end a repeating one, even while it runs. A repeating task is cancelled only when a member asks."
param_id = "The task number."
cancelled = "cancelled: {task}"
cancelled_repeating = "cancelled: {task}. Nothing more is scheduled for it; a run of it already under way still goes to its end."

# Shared by the task tools.
[tasks]
line = "task {id} ({state}) due {due}: {intent}"
line_repeating = "task {id} ({state}, repeats {rule}) next due {due}: {intent}"
last_run = "last run, due {due}: {result}"
repeat_interval = "every {interval}"
repeat_daily = "every day at {time} {zone}"
repeat_weekly = "every {days} at {time} {zone}"
skipped_muted = "skipped, the group was muted"
pending = "pending"
running = "running"
done = "done"
cancelled = "cancelled"
interrupted = "interrupted"
rule_format = "rule must be like 6h, 90m, 1d, daily@08:00 or mon,thu@08:00, got {text}"
interval_too_short = "a repeating task's interval must be at least {min} minutes"
repeat_not_requested = "a repeating task is started, changed or cancelled only in a run started by a member's message asking for it; this run was not"
run_at_format = "run_at must be an RFC 3339 timestamp with an offset, got {text}"
both_times = "give run_at or delay_seconds, not both"
no_time = "give run_at or delay_seconds"
empty_intent = "the intent must not be empty"
too_soon = "the time must be at least {earliest}"
too_many = "the group already has {limit} pending tasks"
chain_deep = "the follow-up chain is already {limit} tasks deep"
not_found = "no such task in this group"
not_pending = "only pending tasks can be changed"
nothing_to_change = "nothing to change"
storage = "the task store failed; whether the change happened is unknown, so do not claim it did"

[tools.web_search]
description = "Search the web for current or factual information the chat and memory do not have. Returns titles, links and excerpts."
param_query = "What to look up, as a short search-engine query."
empty_query = "query must not be empty"
allowance = "the web search allowance is used up for now; answer without searching"
no_results = "no web results for {query}"
header = "Web results for {query}, as the pages give them:"
published = "published {date}"

[tools.read_url]
description = "Read a web page (for example a link from the chat or from web_search) as Markdown. Give a question to get only the passages that answer it."
param_url = "The page's address; http or https only."
param_question = "What you want to find out from the page. Given, only the most relevant passages come back; left out, the whole page (cut if very long)."
invalid_url = "not a valid URL: {error}"
scheme = "only http and https pages can be read"
no_host = "the URL has no host"
credentials = "the URL must not carry a user name or password"
allowance = "the page reading allowance is used up for now; answer without the page"
failed = "could not read {url}: {reason}"
no_text = "{url} was reached but has no readable text"
about_question = "passages of {url} relevant to {question}"
about_page = "the page {url}"
header = "Below is {what}, as Markdown:"
cut = "[cut here: the page has {total} characters and only the first {shown} are shown; ask with a question to get the relevant passages instead]"

[tools.open_images]
description = "Look at pictures or stickers from the chat yourself, when their description does not answer what you need (a detail, small text, what exactly is shown). Each is named by the message it is in and its position among that message's pictures."
param_pictures = "The pictures to open."
param_message = "The message id the picture is in (the number after msg:)."
param_position = "Which picture of that message: 1 for its first [image...] marker, 2 for the second."
param_sticker = "True to open a [sticker...] instead of an [image...]."
none = "name at least one picture"
not_message_id = "{id} is not a message id"
not_in_chat = "message {id} is not in this chat"
position = "positions start at 1"
no_such = "there is no such picture in that message"
too_large = "the picture is larger than the allowed size"
gone = "the picture can no longer be fetched"

# How tool outcomes read in the transcript.
[outcome]
failed = "[tool failed: {why}; the effect is not confirmed]"
not_run = "[tool not run: the arguments were invalid; nothing happened, so correct them and call it again]"
invalid_arguments = "invalid arguments"
execution = "execution error"
unavailable = "unavailable"
timeout = "timed out"
refused = "[tool refused: {why}]"
limit_reached = "a limit was reached"
not_allowed = "not allowed"
conflict = "conflicts with current state"
interrupted = "[interrupted: the effect is unknown; do not assume it happened]"
unknown_tool = "there is no tool named {name}"

# The prompt layer.
[prompt]
group_term = "- \"{term}\" means: {text} (about {percent}% likely)"
group_topic = "- The group is about: {text} (about {percent}% likely)"
member_name = "- member:{member}: {name}"
member_name_unavailable = "- member:{member}: name unavailable; describe them instead of using the number"
person = "{members}"
person_linked = "{members} (linked accounts of one person)"
person_blocked = "  blocked: {members}"
person_names = "  also called: {names}"
person_name_lead = "{name} (a lead from chat, about {percent}% likely)"
person_notes = "  notes written by members: {notes}"
person_note = "\"{text}\" ({date})"
person_facts = "  learned from chat: {facts}"
person_fact = "{predicate}: {value} (about {percent}% likely; {count} episode(s), last {date})"
recap = "episode {id}, {start} - {end}: {title}\n{summary}"

# Memory extraction (the instructions are prompts/extract.md).
[extract]
background_people = "## Who is who\n\nThe members these lines involve, as the group knows them now.\n\n{entries}"
background_member = "- member:{member}: {details}"
background_member_plain = "- member:{member}"
background_shown = "shown as \"{name}\""
background_names = "also called {names}"
background_linked = "one person with {members}"
background_blocked = "blocked in this group"
background_facts = "known before: {facts}"
background_fact = "{predicate}: {value} (about {percent}% likely)"
background_group = "## About the group\n\n{text}"
background_bot = "The group's bot (its lines are `bot:`) is called {names}. These are the bot's names, never names of members."
earlier = "## Earlier in this chat\n\nWhat the chat was about just before these lines (the previous episode), for continuity only; do not summarize it again: {title}: {summary}"
quoted = "Quoted from earlier in the chat (lines here reply to them; context only, do not summarize or quote them):"
tool_description = "Submit the episode for the target part."
param_title = "A few words naming what the target part is about."
param_summary = "One to four self-contained sentences: who said what, what was decided or left open, plans and deadlines with their dates."
param_evidence = "One to three verbatim quotes from lines of the target part."
param_evidence_line = "The line number in the target part (1-based, as shown)."
param_evidence_quote = "Copied exactly, character for character, from that line."
param_names = "Names members go by, each with its source line and quote."
param_name_member = "The member the name refers to (the number after member:)."
param_name_name = "The name exactly as written in the quote."
param_facts = "Facts about members, by the predicates in the instructions."
param_fact_member = "The member the fact is about."
param_fact_predicate = "One of the predicates listed in the instructions."
param_fact_object = "The value, short (a place, a thing, a name), in the words the quote uses, not translated."
param_knowledge = "What the target part shows about the group: a term it uses or what it is about."
param_knowledge_kind = "term or topic."
param_knowledge_term = "For a term: the word or phrase, exactly as members write it in the target part."
param_knowledge_text = "For a term, what it means in this group; for a topic, what the group is about."
param_ended = "Facts the target part says no longer hold for a member (they quit a game, moved away, stopped liking something), by the predicates in the instructions: each ends the fact recorded with that value."
param_ended_object = "The value that no longer holds, as it was recorded (see what is known before) or as the quote says it."
param_line = "The target line the quote is from."
param_quote = "Copied exactly from that line."
context_before = "Context before (for understanding references only; do not summarize or quote it):"
target = "Target part (summarize this), from {from} to {to}, local time ({zone}):"
context_after = "Context after (for understanding references only; do not summarize or quote it):"
predicate = "- {name} ({cardinality}): {rule}"
one_value = "one value"
several_values = "several values"
no_call = "you did not call {tool}"
bad_arguments = "the arguments do not match the schema: {error}"
call_once = "call {tool} exactly once, and nothing else"
rejected = "Rejected:\n{problems}\nFix these and call {tool} again."
problem = "- {problem}"
empty_title = "the title is empty"
empty_summary = "the summary is empty"
evidence_count = "give one to three evidence quotes, got {count}"
evidence_line = "evidence line #{line} is not a line of the target part"
evidence_quote = "the quote for #{line} is not copied exactly from that line"
findings_rejected = "The episode is fine, but some items were not accepted:\n{problems}\nCall {tool} again with the whole answer, fixing these items or leaving them out."
finding = "{list} item {item}: {reason}"
finding_line = "line #{line} is not a line of the target part"
finding_bot_line = "line #{line} is the bot's own line, which is never a source"
finding_event = "line #{line} is an event, not something somebody said"
finding_quote = "the quote for line #{line} is not copied exactly from it"
finding_no_member = "member:{member} does not appear in the chat"
