# The base configuration layer, compiled into the binary and copied to
# /usr/share/qbot/defaults.toml in the image for reference. It lists every setting a deployment
# can choose. Do not edit it: override keys in /etc/qbot/config.toml, in /etc/qbot/conf.d/*.toml,
# or with environment variables (QBOT__SECTION__KEY). Internal tuning such as timeouts, retries
# and bounds on untrusted input is not configuration; it lives with the code it governs.
#
# Credentials never appear here: a `*_secret` key holds the NAME of a secret, which is read
# from the environment or a mounted secret file. Durations carry their unit in the key name.

[bot]
# The bot's own QQ account. It must be set; `check-config` and `run` refuse to start while it
# is 0.
account = 0
# Accounts that may use owner commands and receive the daily report. Owners cannot be blocked.
owners = []
# Names that address the bot as a whole word, besides an @ and quoting one of its messages.
nicknames = []
# IANA time zone for times shown to members and to the model, and for the schedules below.
timezone = "UTC"
# en | zh-CN, or a Fluent catalog <config dir>/locales/<tag>.ftl. The catalog words what
# members read and names the language the bot writes its memory and picture descriptions in.
locale = "en"

[gateway]
# Where NapCat's reverse WebSocket connects (path /onebot/v11/ws).
listen = "0.0.0.0:6199"
# NAME of the secret holding the token NapCat presents. Empty disables authentication, which is
# only sensible on a private network.
access_token_secret = "ONEBOT_ACCESS_TOKEN"

[database]
# The compose service name; change it for an external server.
host = "postgres"
port = 5432
name = "qbot"
user = "qbot"
# disable | prefer | require | verify-ca | verify-full
ssl_mode = "prefer"
password_secret = "DATABASE_PASSWORD"

[network]
# An HTTP(S) proxy for outbound traffic, for hosts that cannot reach a provider directly; empty
# connects directly. Proxy variables in the environment are not used.
proxy = ""
# Which outbound services go through the proxy: text, vision, embedding, search, media (picture
# downloads). The others connect directly.
proxy_for = ["text", "vision", "embedding", "search", "media"]

[replies]
# Replies calling the model at once. More waiting replies are queued; a queue ten times this
# size is full, and further triggers are dropped silently.
concurrency = 3
# A reply not finished this long after its trigger is abandoned; time in the queue counts.
deadline_secs = 180
# Messages one reply may send.
max_messages = 4
# Chance, from 0 to 1, that a member's line that addresses no one makes the bot look at the
# conversation on its own and decide whether to join in (it usually stays silent). Rolled once
# per such line, with one such run per group at a time. 0 never does.
spontaneous_chance = 0.0

[history]
# What a reply is shown of the chat, in batches of lines. Batches are also the unit memory is
# extracted in.
batch_lines = 30
# The newest batches, shown line by line (counting the one being filled).
raw_batches = 4
# The batches before those, shown as summaries of the episodes that cover them (a batch no
# episode covers yet stays verbatim). 0 shows none. Older chat is reached through tools.
summary_batches = 9

[memory]
# Batches summarized into one episode, at most history.raw_batches (the episode must exist
# before its chat leaves the verbatim tier).
slice_batches = 3
# Group terms every reply is shown (the most recently confirmed). The block is part of every
# reply's cached prefix.
group_terms = 40

[memory.recall]
# Cosine distance beyond which an episode is not a candidate at all (below 1). Tuned to the
# embedding model.
max_distance = 0.45
# Candidates rank by similarity times 0.5^(age / half-life), age counted from the episode's
# end: an older episode weighs less, never nothing. 0 ranks by similarity alone.
half_life_days = 180

[memory.facts]
# A learned fact's confidence halves every half-life since it was last confirmed, by its
# predicate's decay class; facts that fade away are expired by the nightly run.
half_life_days = { stable = 90, default = 30, fast = 14 }

[media]
# Transcribe voice clips in the process (SenseVoice on the CPU; the model is fetched once with
# deploy/fetch_asr_model.sh). Off, clips stay `[voice]`.
transcribe_voice = true
# Per group: one busy group cannot use up the describing and transcribing capacity of all.
images_per_minute = 6
clips_per_minute = 20
# How long a reply waits for the group's pictures and clips still being described before it goes
# ahead without them; less than replies.deadline_secs.
reply_wait_secs = 25

[providers.text]
# deepseek | openai_responses
kind = "deepseek"
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "TEXT_API_KEY"
# The reasoning effort of replies: off | low | medium | high
reasoning = "low"
# The reasoning effort of memory extraction (one call per episode, in the background).
extraction_reasoning = "low"

[providers.vision]
# Describes pictures. Off, pictures stay bare `[image]` markers.
enabled = false
# deepseek (images go through its Files API) | openai_responses (sent inline)
kind = "deepseek"
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "VISION_API_KEY"

[providers.embedding]
# An OpenAI-compatible embeddings endpoint.
endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "text-embedding-v4"
# Vector width. After changing the model or the width, the nightly run re-embeds the existing
# episodes; until then recall finds only those already embedded.
dims = 2048
# Inputs per request the endpoint accepts.
max_batch = 10
api_key_secret = "EMBEDDING_API_KEY"

[providers.search]
# Web search and page reading through Tavily (the web_search and read_url tools). Off, the
# tools are not offered.
enabled = false
api_key_secret = "SEARCH_API_KEY"
# basic | advanced (advanced costs two credits a search)
depth = "basic"
# How pages are read: basic | advanced (advanced handles harder pages, two credits)
extract_depth = "basic"

[maintenance]
# Five-field cron expressions in bot.timezone: the nightly run (memory extraction, embedding,
# fact decay, backup, cleanup) and the daily report to the owners. A run missed while the bot
# was down happens once when it comes back.
nightly_cron = "30 2 * * *"
report_cron = "0 0 * * *"
# Verified database backups kept under the data directory; 0 makes none.
backups = 14
# The directory holding pg_dump and pg_restore (of the server's major version); empty finds them
# on PATH, as in the image.
postgres_bin_dir = ""
# Days the operational record is kept: finished runs (their full transcripts, /runs) and finished
# scheduled tasks (/tasks history). Older ones are deleted nightly; 0 keeps them.
records_keep_days = 90
# Ask NapCat to clear its own file cache in the nightly cleanup. NapCat keeps every downloaded
# picture, clip and file otherwise.
napcat_clean_cache = true
