# The base configuration layer, compiled into the binary and copied to
# /usr/share/qbot/defaults.toml in the image for reference. It lists every setting a deployment
# can choose. Do not edit it: override keys in /etc/qbot/config.toml, in /etc/qbot/conf.d/*.toml,
# or with environment variables (QBOT__SECTION__KEY). Internal tuning such as timeouts, retries
# and bounds on untrusted input is not configuration; it lives with the code it governs.
#
# Credentials never appear here: a `*_secret` key holds the NAME of a secret, which is read
# from the environment or a mounted secret file. Durations carry their unit in the key name.

[bot]
# The bot's own QQ account. It must be set; `check-config` and `run` refuse to start while it
# is 0.
account = 0
# Accounts that may use owner commands and receive the daily report. Owners cannot be blocked.
owners = []
# Names that address the bot as a whole word, besides an @ and quoting one of its messages.
nicknames = []
# IANA time zone for times shown to members and to the model, and for the schedules below.
timezone = "UTC"
# en | zh-CN, or a Fluent catalog <config dir>/locales/<tag>.ftl. The catalog words what
# members read and names the language the bot writes its memory and picture descriptions in.
locale = "en"

[gateway]
# Where NapCat's reverse WebSocket connects (path /onebot/v11/ws).
listen = "0.0.0.0:6199"
# NAME of the secret holding the token NapCat presents. Empty disables authentication, which is
# only sensible on a private network.
access_token_secret = "ONEBOT_ACCESS_TOKEN"

[database]
# The compose service name; change it for an external server.
host = "postgres"
port = 5432
name = "qbot"
user = "qbot"
# disable | prefer | require | verify-ca | verify-full
ssl_mode = "prefer"
password_secret = "DATABASE_PASSWORD"

[network]
# An HTTP(S) proxy for outbound traffic, for hosts that cannot reach a provider directly; empty
# connects directly. Proxy variables in the environment are not used.
proxy = ""
# Which outbound services go through the proxy: text, vision, embedding, search, media (picture
# downloads). The others connect directly.
proxy_for = ["text", "vision", "embedding", "search", "media"]

[replies]
# Replies calling the model at once. More waiting replies are queued; a queue ten times this
# size is full, and further triggers are dropped silently.
concurrency = 3
# A reply not finished this long after its trigger is abandoned; time in the queue counts.
deadline_secs = 180
# Messages one reply may send.
max_messages = 4
# Chance, from 0 to 1, that a member's message that did not trigger the bot (no @ of the bot, no
# nickname, no quote of its lines, not a command; a message to another member counts) makes the
# bot look at the conversation on its own and decide whether to join in (it usually stays
# silent). Rolled once per such message; at most one spontaneous run per group at a time, while
# other runs overlap as usual. 0 never does.
spontaneous_chance = 0.0

[history]
# What a reply is shown of the chat between two of the group's memory batches (memory.batch):
# the summaries of the newest episodes, then the chat line by line from just before the last
# batch to now. Nothing in it moves until the next batch, so every reply shares the cached prompt
# prefix of the one before. Older chat is reached through tools. The raw part grows all day; only
# when the provider rejects a request as too long does a reply leave out its older half, and later
# replies start there too until the next batch.
# Episode summaries shown before the raw chat. 0 shows none.
summaries = 8
# Lines from before the last batch shown raw (from the start of the episode holding the first of
# them), so a reply just after the batch still sees the conversation it continues.
carry_lines = 90

[memory]
# When each group's batch runs, in bot.timezone, written as /tasks --every writes a rule
# (daily@HH:MM, days@HH:MM, an interval). The batch reads everything said since the previous one,
# divides it into episodes, records the names and memories it holds, rules on names nobody could
# place and reads earlier episodes again. It is the only time these change (besides members' own
# commands), so pick a quiet hour; at a provider's off-peak hours it also costs less.
batch = "daily@04:00"
# Episodes whose names and memories an earlier version read are read again by the current one,
# this many in each group's batch, the oldest first, until none is left. Each is one model call.
# 0 leaves earlier chat as it was read.
reread_per_batch = 10
# Memories about the group (its terms, what it is about) every reply is shown, the most worth
# first. The block is part of every reply's cached prefix.
group_memories = 40
# Memories every run is shown per member of its conversation (who wrote or was mentioned in its
# newest lines), the most worth first; the rest stay kept and reach /who, about_member and the
# extractor.
person_memories = 8
# The roster every reply's cached prefix lists (what members are shown as, the names people use
# for them): members who spoke within this many days, or are linked, blocked or have a name set
# with /name; at most roster_people people, the most recently active first.
roster_days = 30
roster_people = 80

[memory.recall]
# Cosine distance beyond which an episode is not a candidate at all (below 1). Tuned to the
# embedding model.
max_distance = 0.45
# Candidates rank by similarity times 0.5^(age / half-life), age counted from the episode's
# end: an older episode weighs less, never nothing. 0 ranks by similarity alone.
half_life_days = 180

[memory.rank]
# How fast a memory loses rank in its subject's conversation, by durability: halved for every
# this many episodes its subject takes part in (for the group's memories, every episode of the
# group) without saying it again. Ranks what replies are shown and what makes way when a subject
# is full; a quiet member's or group's clock does not move. Truth is not affected: what readers
# see is who said a memory and when.
half_life_episodes = { lasting = 200, ongoing = 40, current = 10 }

[memory.capacity]
# Memories a group keeps per member and about itself, in every state (a replaced or ended memory
# counts until it makes way). When an episode leaves a subject over its room, the replaced and
# ended memories go first, then the current ones worth least, never what that episode said; the
# episodes keep what was said. Bounds what accumulates in a busy group and what the extractor
# reads about each member.
per_member = 30
group = 120

[media]
# Transcribe voice clips in the process (SenseVoice on the CPU; the model is fetched once with
# deploy/fetch_asr_model.sh). Off, clips stay `[voice]`.
transcribe_voice = true
# Per group: one busy group cannot use up the describing and transcribing capacity of all.
images_per_minute = 6
clips_per_minute = 20
# How long a reply waits for the group's pictures and clips still being described before it goes
# ahead without them; less than replies.deadline_secs.
reply_wait_secs = 25

[providers.text]
# DeepSeek's Responses API.
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "TEXT_API_KEY"
# The reasoning effort of replies: off | low | medium | high
reasoning = "low"
# The reasoning effort of memory extraction (one call per episode, in the background).
extraction_reasoning = "low"

[providers.vision]
# Describes pictures. Off, pictures stay bare `[image]` markers.
enabled = false
# DeepSeek's Responses API; pictures go through its Files API.
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_secret = "VISION_API_KEY"

[providers.embedding]
# An OpenAI-compatible embeddings endpoint.
endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "text-embedding-v4"
# Vector width. After changing the model or the width, a group's next extraction (queued by its
# next filled batch) re-embeds its existing episodes; until then recall finds only those already
# embedded.
dims = 2048
# Inputs per request the endpoint accepts.
max_batch = 10
api_key_secret = "EMBEDDING_API_KEY"

[providers.search]
# Web search and page reading through Tavily (the web_search and read_url tools). Off, the
# tools are not offered.
enabled = false
api_key_secret = "SEARCH_API_KEY"
# basic | advanced (advanced costs two credits a search)
depth = "basic"
# How pages are read: basic | advanced (advanced handles harder pages, two credits)
extract_depth = "basic"

[maintenance]
# When the nightly run (picture-description decay, backup, cleanup) and the daily report to the
# owners happen, as repeat rules in bot.timezone, written as /tasks --every writes them:
# daily@HH:MM, days and a time (mon,thu@HH:MM), or an interval (6h). A run missed while the bot
# was down happens once when it comes back.
nightly = "daily@02:30"
report = "daily@00:00"
# Verified database backups kept under the data directory; 0 makes none.
backups = 14
# The directory holding pg_dump and pg_restore (of the server's major version); empty finds them
# on PATH, as in the image.
postgres_bin_dir = ""
# Days the operational record is kept: finished runs (their full transcripts, /runs) and finished
# scheduled tasks (/tasks history). Older ones are deleted nightly; 0 keeps them.
records_keep_days = 90
# Ask NapCat to clear its own file cache in the nightly cleanup. NapCat keeps every downloaded
# picture, clip and file otherwise.
napcat_clean_cache = true
